<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çanakkale Turizm Yönetim Planı</title>
<meta name="description" content="Çanakkale koruma haritası, Boğaz'ın hikâyesi ve turizm yönetim planının projeleri tek haritada.">
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Sofia+Sans+Condensed:wght@600;800&display=swap">
<style>
/* VOICE: kamu projesi kayıt defteri; sakin, kesin, resmî.
   IDEA: Boğaz'ın pafta defteri: her proje haritada bir iz, yanında künyesi.
   PICTURE: haritanın kendisi; projeler misyon renkleriyle çizilmiş.
   COLOUR and TYPE: beyaz zemin, Boğaz laciverti-yeşili mürekkep, tek kırmızı vurgu; Figtree.
   LAYOUT: solda künye paneli, sağda tam boy harita; telefonda üstte harita, altta panel. */
/* Marka: _plan_kaynak/marka/tokens.json (Çanakkale Turizm Yönetim Planı tasarım sistemi) */
:root{color-scheme:light dark;--bg:light-dark(#FFFFFF,#060B0E);--ink:light-dark(#0A1114,#FFFFFF);--mute:light-dark(#475459,#AAB7BD);--line:light-dark(#D3D9DC,#26333A);--soft:light-dark(#F2F4F5,#0F171B);--sea:light-dark(#00354F,#74C6EA);--sea-on:light-dark(#FFFFFF,#03131B);--red:light-dark(#C8102E,#FF5C70);--tunc:light-dark(#8A6918,#E4C16C);--deniz:light-dark(#DCEAF0,#0E2531);--gece:light-dark(#0A1114,#000000);--fh:"Sofia Sans Condensed","Arial Narrow",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;overflow:hidden}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--gece);color:#fff;border-bottom:2px solid var(--tunc)}
header h1{font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .taslak{font:800 12px var(--fh);letter-spacing:.14em;padding:3px 9px;border:1.5px dashed var(--tunc);color:var(--tunc);border-radius:6px;white-space:nowrap}
header .yz{display:inline-flex}header .yz .hk-btn{padding:6px 9px;border-radius:0;font-weight:700}header .yz .hk-btn:first-child{border-radius:8px 0 0 8px;border-right:0}header .yz .hk-btn:last-child{border-radius:0 8px 8px 0}
#panel{zoom:var(--yz,1)}
body.haritasiz main{grid-template-columns:1fr}
body.haritasiz #map{display:none}
body.haritasiz #panel{border-right:0}
body.haritasiz #panel .ic,body.haritasiz #panel .sek{width:100%;max-width:860px;margin-left:auto;margin-right:auto}
.rozet{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--red);color:#fff;white-space:nowrap}
header .sag{margin-left:auto;display:flex;gap:8px;align-items:center}
header .hk-btn{white-space:nowrap;background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
header .hk-btn:hover{background:rgba(255,255,255,.12)}
main{position:absolute;top:56px;bottom:0;left:0;right:0;display:grid;grid-template-columns:440px 1fr}
body.okuma main{grid-template-columns:min(660px,52vw) 1fr}
/* Plan paneli (açılış): planın 12 bölümü; bölüm 6 ve 10 büyük, GZFT dört kadran */
.ilr{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin:2px 0 14px}
.ilr .cb{flex:1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.ilr .cb i{display:block;height:100%;background:var(--tunc);transition:width .4s ease}
.ilr button{border:0;background:none;font:inherit;color:var(--mute);text-decoration:underline;cursor:pointer;padding:6px 0;min-height:32px}
.radar{background:var(--gece);color:#fff;border-radius:10px;padding:14px 14px 12px;margin:0 0 18px;border-left:3px solid #E4C16C}
.radar .rb{font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:.08em;color:#E4C16C;display:flex;justify-content:space-between;align-items:center;gap:8px}
.radar .rb i{width:8px;height:8px;border-radius:50%;background:#E4C16C;display:inline-block;margin-right:6px;animation:rnab 1.6s ease-in-out infinite}
@keyframes rnab{50%{opacity:.25}}
.radar .tar{font-family:var(--fh);font-weight:800;font-size:28px;line-height:1.1;margin-top:6px}
.radar .gm{min-height:20px;font-size:14px;color:#D3D9DC;margin-top:2px}
.radar .sy{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.radar .sy b{display:block;font-family:var(--fh);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.radar .sy span{font-size:14px;color:#D3D9DC}
.radar .sy .in b{color:#FF5C70}
.radar .ctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.radar input[type=range]{flex:1;accent-color:#E4C16C}
.radar button{background:transparent;border:1px solid #E4C16C;color:#E4C16C;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer;min-width:34px}
.radar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.radar .soz{font-family:var(--fh);font-weight:800;font-size:23px;line-height:1.2;margin:12px 0 0}
.radar .not{font-size:13px;color:#C4CED2;margin:8px 0 0;line-height:1.4}
.radar .lej{font-size:13px;color:#D3D9DC;margin:8px 0 0}
.radar .kb{font-size:15px;color:#E6EBED;margin-top:10px}
.radar .kb b{color:#E4C16C;font-family:var(--fh);font-size:18px}
.radar .yl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.radar .yl button{min-width:56px;font-family:var(--fh);font-size:16px;padding:4px 10px}
.radar .yl button.on{background:#E4C16C;color:#0A1114}
.radar .yl button.ileri{border-style:dashed}
.radar .yl button.ileri.on{background:transparent;color:#E4C16C;border-width:2px}
.radar .calis{margin-top:12px;border:1px solid #FF5C70;border-radius:8px;padding:9px 11px}
.radar .calis b{display:block;font-family:var(--fh);font-size:20px;color:#FF5C70}
.radar .calis span{font-size:15px;color:#E6EBED;line-height:1.45}
.radar .calis ol{margin:6px 0 0;padding-left:20px;font-size:15px;color:#fff;line-height:1.4}
.radar .sy .in b{font-size:26px}
.ozet{margin:0 0 18px}
.ozet .vz{font-family:var(--fh);font-size:19px;font-weight:700;line-height:1.25;color:var(--sea);margin:4px 0 12px;border-left:3px solid var(--tunc);padding-left:10px}
.ozet .dg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ozet .dg span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.ozet .am{display:grid;gap:8px;margin:0 0 10px}
.ozet .am div{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.ozet .am b{font-family:var(--fh);font-size:15px;display:block}
.ozet .am span{font-size:13px;color:var(--mute)}
.ozet ol{margin:0 0 6px;padding-left:20px;font-size:14px}
.ozet h3{font-size:15px;margin:12px 0 6px;letter-spacing:.04em;color:var(--tunc)}
.gemi.hayal{opacity:.5;filter:none}
.gemi.kp path{fill:#FF5C70;stroke:#C8102E}
#rSay{position:absolute;right:12px;bottom:28px;z-index:600;width:min(300px,46%);max-height:62%;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid #D3D9DC;border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.14);font:14px/1.35 Figtree,sans-serif;color:#0A1114;display:none}
body.sade #rSay.on{display:block}
#rSay b{font:800 22px "Sofia Sans Condensed","Arial Narrow",sans-serif;color:#00354F}
#rSay .k{color:#C8102E}
#rSay .iz{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
#rSay .iz i{width:5px;height:11px;border-radius:3px 3px 1px 1px;background:#00354F}
#rSay .iz i.kp{background:#E4405A}
#rSay .iz.hayal i{background:none;border:1px dashed #00354F}
#rSay small{display:block;color:#475459;margin-top:6px;font-size:12px}
.radar .kpz{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:#E6EBED}
.radar .kpz .gemi{transform:rotate(90deg);filter:none}
.gemi.hayal path{fill:none;stroke-dasharray:2 2}
.gemi{width:9px;height:23px;filter:drop-shadow(0 1px 2px rgba(0,53,79,.45))}
.gemi svg{display:block}
.sade-et{width:max-content;transform:translate(-50%,-50%);font:600 13px Figtree,sans-serif;color:#00354F;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;pointer-events:none;white-space:nowrap}
.sade-et.b{font:800 15px "Sofia Sans Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;color:#475459}
.leaflet-tooltip.gemi-et{background:rgba(10,17,20,.88);color:#fff;border:0;font:600 12px Figtree,sans-serif;padding:2px 6px;box-shadow:none}
.leaflet-tooltip.gemi-et:before{display:none}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kt{position:relative;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px;transition:border-color .15s,transform .15s}
.kt:hover{border-color:var(--sea);transform:translateY(-1px)}
.kt .no{font-family:var(--fh);font-weight:800;font-size:13px;color:var(--tunc);letter-spacing:.04em}
.kt .ad{font-weight:600;font-size:13.5px;line-height:1.25}
.kt .dg{font-family:var(--fh);font-weight:800;font-size:30px;line-height:1;color:var(--sea);margin-top:6px}
.kt .al{font-size:12px;color:var(--mute)}
.kt.b{grid-column:1/-1;background:var(--soft);border-color:transparent}
.kt.bos{border-style:dashed}
.kt .ok{position:absolute;top:9px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--tunc);color:#fff;display:none;place-items:center;font-size:12px;font-weight:800}
.kt.gor .ok{display:grid}
.kt.gor{border-color:light-dark(#E5DCC3,#3A3220)}
.gz{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:6px}
.gz span{font-family:var(--fh);font-weight:800;font-size:12px;text-align:center;padding:3px 0;border-radius:4px;background:var(--soft);color:var(--mute)}
.altb{list-style:none;margin:0;padding:0}
.altb li{padding:10px 0;border-bottom:1px solid var(--line)}
.altb .n{font-family:var(--fh);font-weight:800;color:var(--tunc);margin-right:6px}
.altb p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.gbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer}
.gbtn.on{background:var(--tunc);border-color:var(--tunc);color:#fff}
.bag{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.icind{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:12px 0 4px}
.icind a{display:block;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.icind a:hover{color:var(--sea)}
.icind .n,.metin h3 .n{font-family:var(--fh);font-weight:800;color:var(--tunc);margin-right:8px}
.metin{font-size:15px;line-height:1.6}
.metin h3{font-size:20px;margin:28px 0 8px;scroll-margin-top:56px}
.metin h4{font-size:16px;margin:20px 0 6px;font-family:var(--fh)}
.metin h5{font-size:14.5px;margin:16px 0 4px}
.metin p{margin:0 0 10px}
.metin ul,.metin ol{padding-left:20px;margin:0 0 10px}.metin li{margin-bottom:6px}
.metin figure{margin:14px 0}.metin img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.metin figcaption{font-size:13px;margin-top:6px}.metin figcaption .kay,.metin .src{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.metin .cap{font-size:13.5px;margin:16px 0 6px}
.metin .tb{overflow-x:auto;margin:0 0 6px}.metin table{font-size:12.5px}.metin th{font-weight:700;background:var(--soft);padding:6px}.metin td{padding:5px 6px}
#panel{overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column}
#map{height:100%;background:var(--deniz)}
nav.sek{flex:none;display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
nav.sek button{flex:1 0 auto;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:12px 8px;min-height:44px;cursor:pointer;border-bottom:3px solid transparent}
nav.sek button:hover{color:var(--ink)}
nav.sek button.on{color:var(--sea);border-bottom-color:var(--sea)}
.ic{flex:none;padding:14px 16px 40px}
input[type=search],select{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h2,h3{font-family:var(--fh)}
.leaflet-control-layers-toggle{background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2300354F%27 stroke-width=%272%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M12 3l9 5-9 5-9-5z%27/%3E%3Cpath d=%27M3 13l9 5 9-5%27/%3E%3C/svg%3E")!important;background-size:24px 24px!important}
/* Koruma kipi */
#sonuc{max-height:240px;overflow:auto;font-size:13.5px;margin:4px 0 8px}
#sonuc div{padding:7px 6px;cursor:pointer;border-bottom:1px solid var(--line)}
#sonuc div:hover{background:var(--soft)}
#sonuc .ky{color:var(--tunc)}
.grup{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.grup>label{font-weight:600;display:flex;gap:8px;align-items:center;min-height:36px}
.grup .kat label{padding-left:18px}
.kat .n{color:var(--mute);font-size:12px;margin-left:auto}
.sw.cz{height:4px;border-radius:0}
.sw.kz{height:0;border-top:3px dashed;background:none!important;border-radius:0}
.ayar{display:flex;gap:8px;align-items:center;font-size:14px;min-height:40px}
.leaflet-popup-content{font:12.5px/1.4 Figtree,sans-serif;max-height:260px;overflow:auto}
.leaflet-popup-content b{display:block;margin-bottom:4px;font-size:13.5px}
.leaflet-popup-content td{padding:1px 6px 1px 0;vertical-align:top;border:0}
.leaflet-popup-content td:first-child{color:#475459;white-space:nowrap}
.etk{color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
body.acik .etk{color:#0A1114;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.suz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
.say{color:var(--mute);font-size:13px;margin:4px 0 8px}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pl li:hover{background:var(--soft)}
.nok{width:12px;height:12px;border-radius:50%;margin-top:4px}
.pl .k{font-size:12.5px;color:var(--mute)}
.pl .a{font-weight:600}
.geri{border:0;background:none;font:inherit;color:var(--sea);cursor:pointer;padding:8px 0;min-height:44px;font-weight:600}
h2{font-size:24px;line-height:1.15;margin:4px 0 12px;text-wrap:balance}
h3{font-size:15px;margin:22px 0 8px}
.kunye{display:grid;grid-template-columns:8.5em 1fr;gap:6px 12px;background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.kunye dt{color:var(--mute)}.kunye dd{margin:0}
.etiket{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin:0 4px 4px 0;color:var(--mute)}
.uyari{font-size:13px;color:var(--mute);border-left:3px solid var(--red);padding:2px 0 2px 10px;margin:12px 0}
a{color:var(--sea)}
.lnk{cursor:pointer;color:var(--sea);text-decoration:underline;text-underline-offset:2px}
.kat label{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;min-height:36px}
.kat .sw{width:14px;height:14px;border-radius:3px;flex:none}
.leg{display:grid;gap:4px;font-size:13px;margin-top:8px}
.leg span{display:flex;gap:8px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.leaflet-container{font:inherit}
.leaflet-tooltip{font:13px Figtree,sans-serif}
.hk-btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer}
#hk{position:absolute;left:16px;bottom:16px;width:min(460px,calc(100% - 32px));z-index:1000;background:rgba(10,17,20,.9);color:#fff;border-top:2px solid #E4C16C;border-radius:14px;padding:16px 18px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;backdrop-filter:blur(4px)}
body.hk #hk{display:block}
#zc{position:absolute;left:12px;right:12px;top:12px;z-index:1001;background:#fff;color:#0A1114;border:1px solid #D3D9DC;border-radius:14px;padding:10px 16px 8px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none;user-select:none}
body.hk #zc{display:block}
#zc .ust{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:#475459;min-height:20px}
#zc .ust b{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-size:20px;font-weight:800;color:#00354F}
#zc .ust .on{color:#0A1114;font-weight:600}
#zc .iz{position:relative;height:66px;margin-top:4px;cursor:pointer;touch-action:none}
#zc .cag{position:absolute;top:20px;height:16px;border-radius:4px;font-size:11.5px;line-height:16px;padding:0 6px;overflow:hidden;white-space:nowrap;color:#0A1114;background:#F2F4F5;border:1px solid #D3D9DC;box-sizing:border-box}
#zc .cag.t{background:#E8E3D7}
#zc .hat{position:absolute;left:0;right:0;top:47px;height:2px;background:#00354F;opacity:.35}
#zc .ad{position:absolute;top:41px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2.5px solid #00354F;box-sizing:border-box;padding:0;cursor:pointer}
#zc .ad.ar{border-radius:7px;height:14px;margin-left:0;background:#DCEAF0}
#zc .ad.on{background:#8A6918;border-color:#8A6918;transform:scale(1.25)}
#zc .ad.ar.on{background:#8A6918;opacity:.9}
#zc .aral{position:absolute;top:42px;height:12px;border-radius:6px;background:#8A6918;opacity:.28;transition:left .45s ease,width .45s ease;pointer-events:none}
#zc .imle{position:absolute;top:36px;width:3px;height:26px;margin-left:-1.5px;background:#8A6918;border-radius:2px;transition:left .45s ease;pointer-events:none}
#zc .cpa{position:absolute;top:56px;font-size:10.5px;color:#475459;white-space:nowrap;transform:translateX(-50%);pointer-events:none}
#zc .cpa.bas{transform:none}#zc .cpa.son{transform:translateX(-100%)}#zc .cpa.bas:before{left:0}#zc .cpa.son:before{left:100%}
body.hk .leaflet-top{top:172px}
@media (max-width:760px){body.hk .leaflet-top{top:172px}}
#zc .cpa:before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:#475459}
#zc .not{font-size:11px;color:#475459;text-align:right;margin-top:2px}

#zc .ks{position:absolute;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:1.5px solid #8A6918;display:grid;place-items:center;padding:0;cursor:pointer;color:#8A6918}
#zc .ks svg{width:12px;height:12px}
#zc .ks.on{background:#8A6918;color:#fff}
#zc .ks b{position:absolute;right:-7px;top:-6px;background:#00354F;color:#fff;font-size:9.5px;line-height:13px;min-width:13px;border-radius:7px;padding:0 2px}
#zcKart{display:none;margin-top:8px;border-top:1px solid #D3D9DC;padding-top:8px;font-size:13.5px;line-height:1.45;max-height:34vh;overflow:auto}
#zcKart.ac{display:block}

#zcKart .ki svg{width:18px;height:18px}
#zcKart h4{margin:0;font-size:15px;color:#0A1114}
#zcKart .alt{color:#475459;font-size:12.5px}

.kisi-ik{width:30px;height:30px;border-radius:50%;background:#8A6918;color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.kisi-ik svg{width:17px;height:17px}
#hk .once{font-size:14px;color:#E4C16C;margin-top:2px}
@media (max-width:760px){#zc .cpa.k{display:none} #zc .not,#zc .ust .sira{display:none} #zc{padding:8px 12px 4px} #zc .cag{font-size:10px} #zc .ust b{font-size:17px}}
@media (prefers-reduced-motion:reduce){#zc .aral{position:absolute;top:42px;height:12px;border-radius:6px;background:#8A6918;opacity:.28;transition:left .45s ease,width .45s ease;pointer-events:none}
#zc .imle{transition:none}}

#hk .yil{font-family:var(--fh);font-size:clamp(30px,4vw,44px);font-weight:800;line-height:1.05;color:#E4C16C}
#hk .bol{font-size:13px;color:#AAB7BD;margin-bottom:2px}
#hk h2{color:#fff;font-size:23px;margin:6px 0 6px}
#hk p{margin:0 0 10px;font-size:15.5px;line-height:1.5}
#hk .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#hk button{background:#E4C16C;color:#0A1114;border:0;border-radius:8px;font:inherit;font-weight:700;padding:8px 14px;min-height:40px;cursor:pointer}
#hk button.ik{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
#hk .nok2{display:flex;gap:4px;margin-left:auto}
#hk .nok2 i{width:7px;height:7px;border-radius:50%;background:#475459;display:block}
#hk .nok2 i.on{background:#E4C16C}
#hk .son{background:#C8102E;color:#fff}
body.hk #map{grid-column:1/-1}
body.hk #panel{display:none}
.hk-et{width:max-content;color:#0A1114;font-family:"Figtree",sans-serif;font-weight:700;font-size:13px;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;transform:translate(-50%,-50%);pointer-events:none}
.hk-et.b{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:26px;color:#00354F;opacity:.9;letter-spacing:.02em}
.hk-et.sag{transform:translate(8px,-50%)}.hk-et.sol{transform:translate(calc(-100% - 8px),-50%)}
.hk-ik{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.hk-pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.hk-nabiz{animation:nabiz 1.3s ease-in-out infinite}
@keyframes nabiz{0%,100%{stroke-opacity:.95;stroke-width:6}50%{stroke-opacity:.35;stroke-width:10}}
.hk-halka{animation:halka 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes halka{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(1.8)}}
@media(prefers-reduced-motion:reduce){.hk-pop,.hk-nabiz,.hk-halka{animation:none}}
@media(max-width:760px){
 body.hk main{grid-template-rows:1fr}
 #hk{left:8px;right:8px;bottom:8px;width:auto;padding:12px 14px 10px}#hk h2{font-size:18px}#hk p{font-size:15px}
 header{gap:8px;padding:0 10px}header h1{font-size:17px}#surum .uz{display:none}@media(max-width:440px){#surum{display:none}}header .hk-btn{padding:6px 10px}
 main,body.okuma main{grid-template-columns:1fr;grid-template-rows:42% 58%}
 body.haritasiz main{grid-template-rows:1fr}#panel{grid-row:auto}
 header .taslak{font-size:10px;padding:2px 6px}#surum{display:none}header .sag{gap:5px}header .sag .hk-btn{font-size:12.5px;padding:5px 7px}header .uz{display:none}
 #map{grid-row:1}#panel{grid-row:2;border-right:0;border-top:1px solid var(--line)}
}

</head>
<body>
<header>
  <h1>Çanakkale Turizm Yönetim Planı</h1>
  <span class="taslak" title="Plan henüz taslak aşamasındadır">TASLAK</span>
  <span class="rozet" id="surum">v0.9</span>
  <span class="sag">
    <span class="yz" role="group" aria-label="Yazı boyutu"><button class="hk-btn" id="yzKuc" aria-label="Yazıyı küçült">A−</button><button class="hk-btn" id="yzBuy" aria-label="Yazıyı büyüt">A+</button></span>
    <button class="hk-btn" id="hrBtn" aria-pressed="false">Haritayı kapat</button>
    <button class="hk-btn" id="hkBas">Hikâye<span class="uz">yi izle</span></button></span>
</header>
<main>
  <aside id="panel">
    <nav class="sek" id="sek">
      <button data-s="plan" class="on">Plan</button>
      <button data-s="koruma">Değerler</button>
      <button data-s="hikaye">Hikâye</button>
      <button data-s="projeler">Projeler</button>
      <button data-s="kurumlar">Kurumlar</button>
      <button data-s="paketler">İş paketleri</button>
    </nav>
    <div class="ic" id="ic"></div>
  </aside>
  <div id="map"></div>
  <div id="zc" aria-label="Zaman çizgisi"><div class="ust" id="zcUst"></div><div class="iz" id="zcIz" role="slider" tabindex="0" aria-label="Zamanda ilerle"></div><div class="not">Üstteki yuvarlaklar bu topraklarda iz bırakan kişiler: <span style="color:#8A6918">● düşünce ve bilim</span> <span style="color:#00354F">● devlet ve savaş</span> <span style="color:#3D5020">● keşif ve arkeoloji</span>. Her çağa ayrı genişlik verildi; uzunluklar çağ içinde ölçeklidir.</div><div id="zcKart"></div></div>
  <div id="hk" role="dialog" aria-live="polite"><div class="bol" id="hkBol"></div><div class="yil" id="hkYil"></div><div class="once" id="hkOnce"></div><h2 id="hkBas2"></h2><p id="hkMetin"></p>
    <div class="ctl"><button class="ik" id="hkGeri" aria-label="Önceki">←</button><button id="hkIleri">İleri →</button><button class="ik" id="hkKapat">Atla</button><span class="nok2" id="hkNok"></span></div></div>
</main>
<script src="leaflet.js"></script>
<script src="koruma.js"></script>
<script src="projeler.js"></script>
<script src="altlik.js"></script>
<script src="hikaye.js"></script>
<script src="bolumler.js"></script>
<script>
{
const D = window.PLAN, PR = D.projeler, IP = D.ip, KAT = window.KATMANLAR || [];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
document.getElementById("surum").innerHTML = esc(D.surum.split(" ")[0]) + "<span class='uz'> " + esc(D.surum.split(" ").slice(1).join(" ")) + " · " + esc(D.tarih) + "</span>";
const STATU = {A:"Başlatılabilir", B:"Hazırlanmalı", C:"Dönüştürücü"};
const misyonlar = [...new Set(PR.map(p => p.misyon))].sort((a,b) => (parseInt(a)||99) - (parseInt(b)||99));
const RENK = ["#c8102e","#0e7c86","#e08a00","#5b3fa8","#2f8f3a","#b5446e","#1f5fbf","#8a6d1d","#d0531b","#3d6b74","#7a7a7a"];
const renk = m => RENK[misyonlar.indexOf(m) % RENK.length];
const norm = a => a.replace(/\s*\(.*?\)/g,"").trim().replace(/^Belediye$/,"Çanakkale Belediyesi");
const kurumAd = new Map();
PR.forEach(p => { kurumAd.set(slug(p.ana), p.ana); p.katki.forEach(k => { const n = norm(k); if (n) kurumAd.set(slug(n), n); }); });

/* Harita */
const map = L.map("map", {preferCanvas:true, zoomControl:true}).setView([40.05, 26.35], 9);
map.createPane("altlik").style.zIndex = 150;
map.createPane("proje").style.zIndex = 460;
/* Altlıklar: uydu (yer adlı), harita, kabartma; hikâye kipi kabartmayla oynar */
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"});
const uydu = L.layerGroup([L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Esri, Maxar"}), L.tileLayer(ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, pane:"overlayPane"})]);
const kampanya = L.layerGroup(Object.entries(window.ALTLIK || {}).map(([ad,b]) => L.imageOverlay("altlik_"+ad+".jpg", b, {pane:"altlik", attribution: ad==="ege"?"Kabartma: GEBCO 2024":""})));
const ALTLIK = {"Uydu (yer adlı)": uydu, "Harita": osm, "Kabartma": kampanya};
uydu.addTo(map);
L.control.layers(ALTLIK, null, {position:"topright"}).addTo(map);
const altlikSimdi = () => Object.values(ALTLIK).find(l => map.hasLayer(l));
function altlikSec(l){ Object.values(ALTLIK).forEach(x => { if (x !== l) map.removeLayer(x); }); l.addTo(map); document.body.classList.toggle("acik", l !== uydu); }
map.on("baselayerchange", e => document.body.classList.toggle("acik", e.layer !== uydu));

/* Koruma katmanları (webgis_veri.py → koruma.js): kayıt açılır, ad etiketleri yakınlaştıkça çıkar */
function popup(k, p){
  const ad = p.ad || p.label_text || p.name || p.ADI || p.mahalle || k.ad;
  const sat = Object.entries(p).filter(([a]) => a !== "ad").map(([a,v]) => `<tr><td>${esc(a)}</td><td>${esc(v)}</td></tr>`).join("");
  return `<b>${esc(ad)}</b><div style="color:#475459;margin-bottom:4px">${esc(k.grup)} · ${esc(k.ad)}</div><table>${sat}</table>`;
}
function etiketMetni(k, p){
  const ad = p.ad || p.label_text || p.name || p.ADI || "";
  const genel = /^(\d\.?\s*)?(derece\s*)?(arkeoloji̇?k|ark\.?)\s*sit( alanı)?$|^\d\.\s*arkeoloji̇?k sit alanı$|^mevcut$/i;
  if (ad && !genel.test(ad.trim())) return ad;
  if (p.envanter_no) return `${k.ad} (${p.envanter_no})`;
  return ad;
}
const UST = ["Üst koruma", "İdari sınırlar"];
const paneSira = g => UST.includes(g) ? 410 : g.startsWith("Sitler") ? 420 : g === "Kıyı" ? 440 : g === "Proje" ? 450 : 430;
const aranan = [], etiketler = [];
const BUYUK = /^(Büyük proje sahası|Geniş planlama sahası)/;
/* Görülenler: bölümler ve haritada açılan yerler; yalnız bu tarayıcıda saklanır */
const GKEY = "ctp_gorulen";
let GOR = {b:[], y:[]};
/* Yazı boyutu ve harita aç/kapa: tercih bu tarayıcıda saklanır */
const YZ = [.9, 1, 1.12, 1.25, 1.4];
let yzI = 1; try { const k = +localStorage.getItem("ctp_yz"); if (YZ.includes(k)) yzI = YZ.indexOf(k); } catch(e) {}
function yzUygula(){ document.documentElement.style.setProperty("--yz", YZ[yzI]); document.getElementById("yzKuc").disabled = yzI === 0; document.getElementById("yzBuy").disabled = yzI === YZ.length - 1; try { localStorage.setItem("ctp_yz", YZ[yzI]); } catch(e) {} }
document.getElementById("yzKuc").onclick = () => { if (yzI > 0) { yzI--; yzUygula(); } };
document.getElementById("yzBuy").onclick = () => { if (yzI < YZ.length - 1) { yzI++; yzUygula(); } };
yzUygula();
function haritaKapali(k){
  document.body.classList.toggle("haritasiz", k);
  const b = document.getElementById("hrBtn"); b.textContent = k ? "Haritayı aç" : "Haritayı kapat"; b.setAttribute("aria-pressed", k);
  try { localStorage.setItem("ctp_haritasiz", k ? "1" : ""); } catch(e) {}
  if (!k) setTimeout(() => map.invalidateSize(), 30);
}
document.getElementById("hrBtn").onclick = () => haritaKapali(!document.body.classList.contains("haritasiz"));
try { if (localStorage.getItem("ctp_haritasiz")) haritaKapali(true); } catch(e) {}
try { GOR = Object.assign(GOR, JSON.parse(localStorage.getItem(GKEY) || "{}")); } catch(e) {}
const gorKaydet = () => { try { localStorage.setItem(GKEY, JSON.stringify(GOR)); } catch(e) {} };
const halkaKat = L.layerGroup().addTo(map);
function halkaCiz(l){
  const c = l.getLatLng ? l.getLatLng() : l.getBounds().getCenter();
  L.circleMarker(c, {radius:12, color:"#8A6918", weight:2.5, fill:false, interactive:false, pane:"proje"}).addTo(halkaKat);
}
function yerGoruldu(l){ if (GOR.y.includes(l._k)) return; GOR.y.push(l._k); gorKaydet(); halkaCiz(l); }
const katman = KAT.map((k,i) => {
  const pn = "p" + paneSira(k.grup);
  if (!map.getPane(pn)) map.createPane(pn).style.zIndex = paneSira(k.grup);
  const st = {pane:pn, color:k.renk, weight:k.grup==="Kıyı"?3.5:k.cizgi?2.2:1, opacity:.95, fillColor:k.renk, fillOpacity:k.cizgi?0:(UST.includes(k.grup)?.12:.35), dashArray:k.kesik?"6 5":null};
  const buyuk = BUYUK.test(k.ad); let fi = 0;   // büyük alanlar tıklamayı yutmasın
  return L.geoJSON(k.veri, {pane:pn, style:() => st, interactive:!buyuk,
    pointToLayer:(f,ll) => L.circleMarker(ll,{pane:pn, radius:k.grup==="Proje"?7:5, color:"#222", weight:1, fillColor:k.renk, fillOpacity:.95}),
    onEachFeature:(f,l) => { l._k = i + ":" + (fi++); if (buyuk) return;
      if (!["Kıyı","İdari sınırlar","Proje"].includes(k.grup)) l.on("popupopen", () => yerGoruldu(l));
      const p=f.properties||{}; const ad=p.ad||p.label_text||p.name||p.ADI||p.mahalle||""; const et=etiketMetni(k,p);
      l.bindPopup(() => popup(k,p)); l.bindTooltip(`${esc(et||k.ad)}<br><span style="opacity:.75">${esc(k.ad)}</span>`,{sticky:true});
      if (ad) aranan.push({ad:String(ad), alt:k.ad, i, l}); if (et && !k.cizgi) etiketler.push({k, i, l, metin:et}); }});
});
katman.forEach(g => g.eachLayer(l => { if (GOR.y.includes(l._k)) halkaCiz(l); }));
const esik = k => k.grup==="Proje" ? 9 : /tabya|Askerî/.test(k.ad) ? 11 : k.grup.startsWith("Tescilli") ? 14 : k.grup==="Üst koruma" ? 9 : 12;
const etiketKat = L.layerGroup().addTo(map);
function etiketleriCiz(){
  etiketKat.clearLayers(); if (document.body.classList.contains("hk") || document.body.classList.contains("sade")) return;
  const z = map.getZoom(), b = map.getBounds().pad(0.1);
  etiketler.forEach(e => { if (z < esik(e.k) || !map.hasLayer(katman[e.i]) || (solukMu && SOLUK.has(e.i))) return;
    const c = e.l.getLatLng ? e.l.getLatLng() : e.l.getBounds().getCenter(); if (!b.contains(c)) return;
    etiketKat.addLayer(L.marker(c,{interactive:false, icon:L.divIcon({className:"etk", html:esc(e.metin.length>42 ? e.metin.slice(0,40)+"…" : e.metin), iconSize:null})})); });
}
map.on("zoomend moveend", etiketleriCiz);
/* Koruma kipinde kullanıcının seçtiği katmanlar; plan sekmelerinde yalnız sınır ve kıyı */
const korumaAcik = new Set(KAT.map((k,i) => k.acik ? i : -1).filter(i => i >= 0));
const PLAN_ADLAR = ["İlçe sınırları", "Kıyı kenar çizgisi (2022 UİP)", "İl kıyısı (ilçe sınırından)"];
const planAcik = new Set(KAT.map((k,i) => PLAN_ADLAR.includes(k.ad) ? i : -1).filter(i => i >= 0));
let projeGoster = false;

const projeKat = L.featureGroup().addTo(map); const izler = new Map();
/* Plan kipinde değerler soluk altlık olur; proje sahası ve projeler önde */
const SOLUK = new Set([...korumaAcik].filter(i => !["Kıyı","İdari sınırlar","Proje"].includes(KAT[i].grup)));
const planSeti = new Set([...planAcik, ...SOLUK, ...KAT.map((k,i) => k.grup==="Proje" && k.acik ? i : -1).filter(i => i >= 0)]);
const SOLUK_ST = {color:"#8b979c", fillColor:"#8b979c", fillOpacity:.10, opacity:.55, weight:1};
let solukMu = false;
function soluk(on){
  if (on === solukMu) return; solukMu = on;
  SOLUK.forEach(i => katman[i].eachLayer(l => {
    if (!l._ilk) l._ilk = {color:l.options.color, fillColor:l.options.fillColor, fillOpacity:l.options.fillOpacity, opacity:l.options.opacity, weight:l.options.weight};
    l.setStyle(on ? SOLUK_ST : l._ilk); }));
}
function katmanUygula(){
  if (document.body.classList.contains("hk") || document.body.classList.contains("sade")) return;
  const kor = sekme === "koruma", pl = sekme === "plan", set = kor ? korumaAcik : pl ? planSeti : planAcik;
  katman.forEach((l,i) => set.has(i) ? l.addTo(map) : map.removeLayer(l));
  soluk(pl);
  (!kor || projeGoster) ? projeKat.addTo(map) : map.removeLayer(projeKat);
  etiketleriCiz();
}
function ciz(liste){
  projeKat.clearLayers(); izler.clear();
  liste.forEach(p => {
    if (!p.geom) return;
    const c = renk(p.misyon), yk = p.konum === "yaklaşık";
    const lyr = L.geoJSON(p.geom, {pane:"proje",
      style:{pane:"proje", color:c, weight:p.geom.type.includes("Line")?5:2, fillColor:c, fillOpacity:.25, dashArray:null},
      pointToLayer:(f,ll) => L.circleMarker(ll,{pane:"proje", radius:yk?7:8,color:yk?c:"#fff",weight:yk?2:2,dashArray:yk?"3 3":null,fillColor:c,fillOpacity:yk?.35:.95})
    });
    lyr.bindTooltip("<b>"+esc(p.kod)+"</b> "+esc(p.ad)+"<br><span style='opacity:.7'>"+esc(p.ana)+" · "+esc(p.donem)+(yk?" · yaklaşık konum":"")+"</span>",{sticky:true});
    lyr.on("click", () => { location.hash = "proje-" + slug(p.kod); });
    lyr.addTo(projeKat); izler.set(p.kod, lyr);
  });
}

/* Panel */
const ic = document.getElementById("ic");
let sekme = "koruma", suz = {q:"", m:"", k:"", d:""};
function sekmeSec(s){ sekme = s; document.querySelectorAll("#sek button").forEach(b => b.classList.toggle("on", b.dataset.s === s)); katmanUygula(); }
document.querySelectorAll("#sek button").forEach(b => b.onclick = () => { location.hash = b.dataset.s; });

function suzulmus(){
  const q = suz.q.toLocaleLowerCase("tr");
  return PR.filter(p => (!suz.m || p.misyon === suz.m) && (!suz.k || slug(p.ana) === suz.k || p.katki.some(x => slug(norm(x)) === suz.k)) && (!suz.d || p.donem === suz.d)
    && (!q || (p.kod+" "+p.ad+" "+p.metin+" "+p.yer+" "+p.ana).toLocaleLowerCase("tr").includes(q)));
}
const satir = p => `<li data-k="${esc(p.kod)}"><span class="nok" style="background:${renk(p.misyon)}"></span><div><div class="k">${esc(p.kod)} · ${esc(p.ana)} · ${esc(p.donem)}</div><div class="a">${esc(p.ad)}</div></div></li>`;
function listeBagla(){ ic.querySelectorAll(".pl li").forEach(li => li.onclick = () => { location.hash = "proje-" + slug(li.dataset.k); }); }

function projeler(){
  sekmeSec("projeler");
  const donemler = [...new Set(PR.map(p => p.donem))].sort();
  const kurumlar = [...new Set(PR.map(p => p.ana))].sort((a,b) => a.localeCompare(b,"tr"));
  ic.innerHTML = `<input type="search" id="q" placeholder="Proje, yer ya da kurum ara (ör. tabya, Troya, kordon)" value="${esc(suz.q)}">
  <div class="suz">
    <select id="fm"><option value="">Tüm misyonlar</option>${misyonlar.map(m => `<option ${m===suz.m?"selected":""}>${esc(m)}</option>`).join("")}</select>
    <select id="fk"><option value="">Tüm ana sorumlular</option>${kurumlar.map(k => `<option value="${slug(k)}" ${slug(k)===suz.k?"selected":""}>${esc(k)}</option>`).join("")}</select>
    <select id="fd" style="grid-column:1/-1"><option value="">Tüm dönemler</option>${donemler.map(d => `<option ${d===suz.d?"selected":""}>${esc(d)}</option>`).join("")}</select>
  </div><div class="say" id="say"></div><ul class="pl" id="pl"></ul>

const YILLAR = [
  {yil:"2022", gemi:143, yolcu:220082, kaynak:"Ulaştırma ve Altyapı Bakanlığı (Bloomberg HT)"},
  {yil:"2023", gemi:225, yolcu:402729, kaynak:"Ulaştırma ve Altyapı Bakanlığı (haberler.com)"},

const KEPEZ_ORAN = 40 / 265;    // 2025'te Kepez'e ~40 gemi, İstanbul'a 265 (Plan 2.3.3); diğer yıllara aynı oran (VARSAYIM)
const GECIS = 3200;             // bir geminin ekranda Boğaz'ı geçişi (ms)
const ARA = {gecmis: 32, ileri: 22};   // iki gemi arası (ms); üç şerit → şerit başına bunun üç katı
const yilSure = y => Math.round(y.gemi * (y.ileri ? ARA.ileri : ARA.gecmis) + GECIS + 700);
const YBAS = (() => { const b = [0]; YILLAR.forEach(y => b.push(b.at(-1) + yilSure(y))); return b; })();   // yılların başlangıç anları

const KEPEZ_YOL = [[40.00,26.10],[40.03,26.19],[40.075,26.27],[40.092,26.335],[40.097,26.378]];
function yolHesap(Y){ const u = [0]; for (let i = 1; i < Y.length; i++) u.push(u[i-1] + Math.hypot(Y[i][0]-Y[i-1][0], (Y[i][1]-Y[i-1][1]) * .77)); return u; }
const rotaUz = yolHesap(ROTA), kepezUz = yolHesap(KEPEZ_YOL);
function yolNoktasi(Y, U, p){
  const Lp = p * U.at(-1); let i = 1; while (i < U.length - 1 && U[i] < Lp) i++;
  const t = (Lp - U[i-1]) / (U[i] - U[i-1] || 1), a = Y[i-1], b = Y[i];
  return {ll: [a[0] + (b[0]-a[0]) * t, a[1] + (b[1]-a[1]) * t], aci: Math.atan2((b[1]-a[1]) * .77, b[0]-a[0]) * 180 / Math.PI};
}
function seritNokta(p, kay){
  const n = yolNoktasi(ROTA, rotaUz, p), r = n.aci * Math.PI / 180;   // rotaya dik kaydırma (iki paralel şerit, ikisi de İstanbul'a)
  return {ll: [n.ll[0] - Math.sin(r) * kay, n.ll[1] + Math.cos(r) * kay / .77], aci: n.aci};
}

  const merkez = map.unproject(map.project([s.cam[0],s.cam[1]], s.cam[2]).add(ofs), s.cam[2]);
  try { map.flyTo(merkez, s.cam[2], {duration: AZ?0:1.4}); } catch(e) { map.setView([s.cam[0],s.cam[1]], s.cam[2]); }
  await bekle(1500); if (j!==hkJeton) return;
  for (const a of s.a) { if (j!==hkJeton) return; await eylem(a); }
}
function hkBaslat(i=0){
  if (!document.body.classList.contains("hk")) { hkOnceki = altlikSimdi(); altlikSec(kampanya); }
  if (document.body.classList.contains("haritasiz")) haritaKapali(false);
  document.body.classList.add("hk"); zcKur(); map.invalidateSize(); [projeKat, halkaKat, ...katman].forEach(l => map.removeLayer(l)); etiketKat.clearLayers(); map.closePopup(); hkKat.addTo(map); hkGoster(i);
}
function hkKapat(){
  hkJeton++; hkRaf.forEach(cancelAnimationFrame); hkRaf=[]; hkKat.clearLayers(); map.removeLayer(hkKat);
  document.body.classList.remove("hk"); if (kisiMarker) { map.removeLayer(kisiMarker); kisiMarker=null; } document.getElementById("zcKart").classList.remove("ac"); altlikSec(hkOnceki || uydu); halkaKat.addTo(map); katmanUygula();
  try { localStorage.setItem("ctp_hikaye_izlendi","1"); } catch(e) {}
  setTimeout(() => map.invalidateSize(), 50);
}
document.getElementById("hkIleri").onclick = () => hkI < H.adimlar.length-1 ? hkGoster(hkI+1) : (hkKapat(), location.hash="plan");
document.getElementById("hkGeri").onclick = () => hkI > 0 && hkGoster(hkI-1);
document.getElementById("hkKapat").onclick = () => hkKapat();
document.getElementById("hkBas").onclick = () => hkBaslat(0);
document.addEventListener("keydown", e => { if (!document.body.classList.contains("hk")) return; if (e.key==="ArrowRight") document.getElementById("hkIleri").click(); if (e.key==="ArrowLeft") document.getElementById("hkGeri").click(); if (e.key==="Escape") hkKapat(); });
function hikayeListe(){
  sekmeSec("hikaye"); ciz(PR);
  ic.innerHTML = `<p class="say">Boğaz'ın üç bin yılı, harita üstünde. İsteyen baştan izler, isteyen istediği bölümü açar.</p>
  <button class="hk-btn" id="hkBastan" style="margin-bottom:8px">Baştan izle</button>
  ${H.bolumler.map((b,bi) => `<h3>${"Bölüm " + (bi + 1) + ". "}${esc(b)}</h3><ul class="pl">${H.adimlar.map((s,i) => [s,i]).filter(([s]) => s.b===bi).map(([s,i]) => `<li data-hk="${i}"><span class="nok" style="background:#c8102e"></span><div><div class="k">${esc(s.yil)}</div><div class="a">${esc(s.baslik)}</div></div></li>`).join("")}</ul>`).join("")}
  <h3>Bu topraklarda iz bırakanlar</h3><ul class="pl">${KS.map((k,i)=>[k,i]).sort((a,b)=>a[0].z[0]-b[0].z[0]).map(([k,i]) => `<li data-ki="${i}"><span class="nok" style="background:${krenk(k)}"></span><div><div class="k">${esc(k.tarih)} · ${esc(k.yer)}</div><div class="a">${esc(k.ad)}</div></div></li>`).join("")}</ul>
  <h3>Kaynaklar</h3><p style="font-size:14px">${H.kaynaklar.map(esc).join("<br>")}</p>
  <h3>Doğrulanacak ve yaklaşık olanlar</h3><p style="font-size:14px">${H.dogrulanacak.map(esc).join("<br>")}</p>`;
  document.getElementById("hkBastan").onclick = () => hkBaslat(0);
  ic.querySelectorAll("li[data-hk]").forEach(li => li.onclick = () => hkBaslat(+li.dataset.hk));
  ic.querySelectorAll("li[data-ki]").forEach(li => li.onclick = () => { hkBaslat(hkI||0); setTimeout(() => kisiKart(+li.dataset.ki), 1700); });
}

function yonlendir(){
  const h = location.hash.slice(1);
  radarDur();
  const okuma = h.startsWith("bolum-");
  if (okuma !== document.body.classList.contains("okuma")) { document.body.classList.toggle("okuma", okuma); setTimeout(() => map.invalidateSize(), 60); }
  if (h.startsWith("proje-")) return proje(h.slice(6));
  if (h.startsWith("kurum-")) return kurum(h.slice(6));
  if (h.startsWith("ip-")) return paket(h.slice(3));
  if (h.startsWith("hikaye-")) { hikayeListe(); return hkBaslat(Math.max(0, parseInt(h.slice(7)) - 1 || 0)); }
  if (h === "hikaye") return hikayeListe();
  if (h.startsWith("bolum-")) return bolum(h.slice(6));
  ({plan:planPanel, projeler, kurumlar, paketler, koruma, degerler:koruma, katmanlar:koruma, hakkinda}[h] || planPanel)();
  ic.scrollTop = 0;
}
window.addEventListener("resize", () => { if (document.body.classList.contains("hk")) { zcKur(); zcIsaretle(hkI); } });
window.addEventListener("hashchange", () => { if (document.body.classList.contains("hk") && !location.hash.startsWith("#hikaye")) hkKapat(); yonlendir(); document.getElementById("panel").scrollTop = 0; });
yonlendir();
/* Açılış Yönetim Planı panelidir; hikâye yalnız istenince başlar (kullanıcı kararı, 24.11.2026) */
}
